<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для Лейлы 💜</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Падающие сердечки на фоне -->
  <div class="hearts-bg" id="heartsBg"></div>

  <main class="card">
    <div class="cake">🎂</div>
    <h1 class="title">Привет, Лейла!</h1>
    <p class="subtitle">Этот сайт сделан специально для тебя 💜</p>

    <div class="buttons">
      <button class="btn btn-primary" id="loveBtn">
        Нажми, если ты классная ✨
      </button>
      <button class="btn btn-secondary" id="secretBtn">
        Секрет 🤫
      </button>
    </div>

    <p class="counter" id="counter">Комплиментов получено: 0</p>

    <!-- Модалка с секретом -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <h2>Секретное послание 💌</h2>
        <p>Лейла, ты — самый светлый человек, которого я знаю. Спасибо, что ты есть! 🌸</p>
      </div>
    </div>
  </main>

  <footer class="footer">Сделано с любовью 💜</footer>

  <script src="script.js"></script>
</body>
</html>
